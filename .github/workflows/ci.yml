name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows minutes cost more on private repos, so pull requests run on Linux
        # and every push to main runs on both.
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0  # upstream has no floating major tag; Dependabot bumps it
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and format check
        run: uv run poe lint

      - name: Type check
        run: uv run poe typecheck

      - name: Tests with coverage
        run: uv run poe test
